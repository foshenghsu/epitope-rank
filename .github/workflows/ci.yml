name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The mhcflurry extra is deliberately left out: it pulls in TensorFlow and
        # needs a model download. The suite runs on the deterministic predictor.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,plot]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI on the example antigen
        run: |
          epitope-rank \
            --fasta data/NY-ESO-1_P78358.fasta \
            --alleles 'HLA-A*02:01,HLA-B*07:02' \
            --predictor toy --top 5 --out /tmp/epitope-rank-ci
          test -s /tmp/epitope-rank-ci/shortlist.tsv
